services:
  automate:
    image: automate-app:latest
    pull_policy: never
    container_name: automate-app
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "6080:6080"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - CONCURRENCY=5
      - DISPLAY=:99
    volumes:
      - automate-profiles:/app/local_profiles
      - automate-downloads:/app/downloads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/admin/queues').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  automate-profiles:
    name: automate-profiles
  automate-downloads:
    name: automate-downloads
